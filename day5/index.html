<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Users Directory</title>
		
		<script src="users.js" defer></script>
	</head>
	<body>
		<main>
			<p class="eyebrow">Remote directory</p>
			<h1>Users Directory</h1>
			<p class="intro">Browse the team and find people by name.</p>

			<div class="controls">
				<button id="load-users" type="button">Load users</button>

				<div class="filter">
					<label for="filter-input">Filter by name</label>
					<input id="filter-input" type="search" placeholder="Type a name" />
				</div>
			</div>

			<p id="status" role="status" aria-live="polite">Click “Load users” to begin.</p>
			<ul id="users-list"></ul>
		</main>
	</body>
</html>
